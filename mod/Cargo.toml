[workspace]
resolver = "2"
members = ["bo2snd", "eldenops", "eldenops-setup"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
